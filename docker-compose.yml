# Full local stack (spec §55).
#
#   docker compose up -d --build        # app + postgres
#   docker compose up -d postgres       # database only (run the app with `npm run dev`)
#
services:
  postgres:
    image: postgres:16-alpine
    container_name: mon_portfolio_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mon_portfolio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mon_portfolio_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/mon_portfolio?schema=public"
      AUTH_SECRET: "${AUTH_SECRET:?set AUTH_SECRET in your shell or an .env file}"
      NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}"
      STORAGE_PROVIDER: "${STORAGE_PROVIDER:-local}"
      CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME:-}"
      CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY:-}"
      CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET:-}"
      CLOUDINARY_FOLDER: "${CLOUDINARY_FOLDER:-portfolio}"
      EMAIL_FROM: "${EMAIL_FROM:-no-reply@localhost}"
    volumes:
      # persist local-disk uploads when STORAGE_PROVIDER=local
      - uploads:/app/public/uploads

volumes:
  pgdata:
  uploads:
